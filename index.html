<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="音検知アラーム"
  >

  <title>音検知アラーム</title>

  <style>
    :root {
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --green: #22c55e;
      --orange: #f97316;
      --red: #dc2626;
      --text: #0f172a;
      --subtext: #64748b;
      --line: #e2e8f0;
      --background: #f1f5f9;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
    }

    body {
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    button,
    input,
    label {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .page {
      min-height: 100vh;
      padding:
        max(24px, env(safe-area-inset-top))
        16px
        max(24px, env(safe-area-inset-bottom));
      background:
        linear-gradient(
          180deg,
          #eff6ff 0%,
          #f8fafc 45%,
          #f1f5f9 100%
        );
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .dog-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      color: #ffffff;
      font-size: 38px;
      background: var(--blue);
      border-radius: 22px;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--subtext);
      font-size: 13px;
    }

    .card {
      padding: 20px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
    }

    .status-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 18px;
    }

    .small-label {
      margin: 0 0 4px;
      color: var(--subtext);
      font-size: 12px;
      font-weight: 600;
    }

    #statusText {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .status-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      font-size: 23px;
      background: #e2e8f0;
      border-radius: 50%;
    }

    .status-icon.running {
      color: #15803d;
      background: #dcfce7;
      animation: pulse 1.8s infinite;
    }

    .status-icon.triggered {
      color: #c2410c;
      background: #ffedd5;
      animation: alertPulse 0.45s infinite alternate;
    }

    @keyframes pulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.12);
      }
    }

    @keyframes alertPulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.12);
      }
    }

    .volume-section {
      margin: 24px 0;
    }

    .volume-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .volume-title {
      font-size: 14px;
      font-weight: 700;
    }

    .volume-number {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }

    .volume-total {
      margin-left: 3px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
    }

    .meter {
      position: relative;
      height: 21px;
      overflow: hidden;
      background: #e2e8f0;
      border-radius: 999px;
    }

    #meterBar {
      width: 0%;
      height: 100%;
      background: var(--green);
      border-radius: 999px;
      transition:
        width 0.08s linear,
        background-color 0.1s;
    }

    #thresholdLine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 16%;
      width: 3px;
      background: #0f172a;
      transform: translateX(-1px);
    }

    .threshold-label {
      margin-top: 6px;
      color: var(--subtext);
      font-size: 12px;
      text-align: right;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .preset-button {
      min-height: 78px;
      padding: 10px 5px;
      color: #334155;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 17px;
      cursor: pointer;
    }

    .preset-button:active {
      transform: scale(0.97);
    }

    .preset-button.selected {
      color: #1d4ed8;
      background: var(--blue-light);
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .preset-name {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 800;
    }

    .preset-help {
      display: block;
      color: var(--subtext);
      font-size: 10px;
      line-height: 1.35;
    }

    details {
      margin-top: 12px;
      padding: 14px;
      background: #f8fafc;
      border-radius: 16px;
    }

    summary {
      color: #475569;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .detail-control {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .step-button {
      width: 52px;
      height: 48px;
      color: #1e293b;
      font-size: 25px;
      font-weight: 700;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
    }

    .step-button:active {
      background: #e2e8f0;
      transform: scale(0.96);
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
      accent-color: var(--blue);
    }

    .sensitivity-note {
      margin: 10px 0 0;
      color: var(--subtext);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .sound-box {
      margin-top: 20px;
      padding: 16px;
      border: 1px dashed #cbd5e1;
      border-radius: 18px;
    }

    .sound-header {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .sound-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 41px;
      height: 41px;
      font-size: 21px;
      background: #fef3c7;
      border-radius: 13px;
    }

    .sound-info {
      flex: 1;
      min-width: 0;
    }

    .sound-title {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
    }

    #soundName {
      display: block;
      max-width: 100%;
      margin-top: 3px;
      overflow: hidden;
      color: var(--subtext);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 47px;
      height: 42px;
      padding: 0 12px;
      color: #334155;
      font-size: 20px;
      background: #f1f5f9;
      border-radius: 13px;
      cursor: pointer;
    }

    #barkFile {
      display: none;
    }

    .sound-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 14px;
    }

    .secondary-button {
      min-height: 44px;
      padding: 9px 8px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 13px;
      cursor: pointer;
    }

    .secondary-button:disabled {
      color: #94a3b8;
      background: #f8fafc;
      cursor: default;
    }

    .secondary-button:active:not(:disabled) {
      background: #f1f5f9;
      transform: scale(0.98);
    }

    .main-button {
      width: 100%;
      min-height: 57px;
      margin-top: 20px;
      padding: 13px 18px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      background: var(--blue);
      border: 0;
      border-radius: 17px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
      cursor: pointer;
    }

    .main-button.stop {
      background: #334155;
      box-shadow: none;
    }

    .main-button:active {
      transform: scale(0.98);
    }

    .notice {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 15px 2px 0;
      color: var(--subtext);
      font-size: 11px;
      line-height: 1.55;
    }

    .notice-mark {
      color: #16a34a;
      font-size: 15px;
      font-weight: 800;
    }

    #errorBox {
      display: none;
      margin-top: 14px;
      padding: 13px;
      color: #991b1b;
      font-size: 12px;
      line-height: 1.5;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 13px;
    }

    .calibration-note {
      display: none;
      margin-top: 10px;
      color: var(--subtext);
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="container">

      <header class="header">
        <div class="dog-icon" aria-hidden="true">🐕</div>

        <h1>音検知アラーム</h1>

        <p class="subtitle">
          大きな音を検知して犬の声で知らせます
        </p>
      </header>

      <section class="card">

        <div class="status-box">
          <div>
            <p class="small-label">状態</p>
            <p id="statusText">待機中</p>
          </div>

          <div
            id="statusIcon"
            class="status-icon"
            aria-hidden="true"
          >
            🎤
          </div>
        </div>

        <div class="volume-section">
          <div class="volume-row">
            <span class="volume-title">
              現在の音量
            </span>

            <span>
              <span
                id="currentVolume"
                class="volume-number"
              >
                0
              </span>

              <span class="volume-total">
                / 100
              </span>
            </span>
          </div>

          <div class="meter">
            <div id="meterBar"></div>
            <div id="thresholdLine"></div>
          </div>

          <div class="threshold-label">
            反応ライン
            <strong id="thresholdValue">16</strong>
          </div>
        </div>

        <section>
          <h2 class="section-title">
            反応しやすさ
          </h2>

          <div class="preset-grid">
            <button
              type="button"
              class="preset-button"
              data-name="高感度"
              data-value="8"
            >
              <span class="preset-name">
                高感度
              </span>

              <span class="preset-help">
                小さな物音にも反応
              </span>
            </button>

            <button
              type="button"
              class="preset-button selected"
              data-name="標準"
              data-value="16"
            >
              <span class="preset-name">
                標準
              </span>

              <span class="preset-help">
                会話・足音程度
              </span>
            </button>

            <button
              type="button"
              class="preset-button"
              data-name="低感度"
              data-value="28"
            >
              <span class="preset-name">
                低感度
              </span>

              <span class="preset-help">
                大きな音だけに反応
              </span>
            </button>
          </div>

          <details>
            <summary>
              細かく調整する
            </summary>

            <div class="detail-control">
              <button
                type="button"
                id="minusButton"
                class="step-button"
                aria-label="反応しやすくする"
              >
                −
              </button>

              <input
                type="range"
                id="thresholdSlider"
                min="3"
                max="50"
                step="1"
                value="16"
                aria-label="反応する音量"
              >

              <button
                type="button"
                id="plusButton"
                class="step-button"
                aria-label="反応しにくくする"
              >
                ＋
              </button>
            </div>

            <p class="sensitivity-note">
              数字を小さくすると反応しやすくなります。
            </p>
          </details>
        </section>

        <section class="sound-box">
          <div class="sound-header">
            <div
              class="sound-icon"
              aria-hidden="true"
            >
              🔊
            </div>

            <div class="sound-info">
              <p class="sound-title">
                犬の声
              </p>

              <span id="soundName">
                内蔵音を使用中
              </span>
            </div>

            <label
              class="file-button"
              for="barkFile"
              title="犬の音声を選択"
              aria-label="犬の音声を選択"
            >
              📂
            </label>

            <input
              type="file"
              id="barkFile"
              accept="audio/*,.mp3,.m4a,.wav,.aac"
            >
          </div>

          <div class="sound-actions">
            <button
              type="button"
              id="previewButton"
              class="secondary-button"
            >
              🔊 試聴
            </button>

            <button
              type="button"
              id="resetSoundButton"
              class="secondary-button"
              disabled
            >
              ↩ 内蔵音に戻す
            </button>
          </div>

          <audio
            id="customBarkAudio"
            preload="auto"
            playsinline
          ></audio>
        </section>

        <div id="errorBox"></div>

        <p
          id="calibrationNote"
          class="calibration-note"
        >
          周囲の音を測定しています。
          少し静かにしてください。
        </p>

        <button
          type="button"
          id="monitorButton"
          class="main-button"
        >
          🎤 監視スタート
        </button>

        <div class="notice">
          <span class="notice-mark">✓</span>

          <span>
            音声は端末内で解析し、録音・送信しません。
            画面を閉じたりiPhoneをロックしたりすると、
            監視が停止する場合があります。
          </span>
        </div>

      </section>
    </div>
  </main>

  <script>
    "use strict";

    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let mediaStream = null;
    let animationId = null;

    let isMonitoring = false;
    let isCalibrating = false;
    let isAlarmPlaying = false;

    let threshold = 16;
    let selectedPreset = "標準";
    let noiseFloor = 0;
    let lastTriggerTime = 0;
    let customSoundUrl = "";

    const minimumThreshold = 3;
    const maximumThreshold = 50;

    const triggerInterval = 3500;

    const sensitivityStorageKey =
      "soundAlarmThresholdV2";

    const statusText =
      document.getElementById("statusText");

    const statusIcon =
      document.getElementById("statusIcon");

    const currentVolume =
      document.getElementById("currentVolume");

    const meterBar =
      document.getElementById("meterBar");

    const thresholdLine =
      document.getElementById("thresholdLine");

    const thresholdValue =
      document.getElementById("thresholdValue");

    const thresholdSlider =
      document.getElementById("thresholdSlider");

    const monitorButton =
      document.getElementById("monitorButton");

    const minusButton =
      document.getElementById("minusButton");

    const plusButton =
      document.getElementById("plusButton");

    const barkFile =
      document.getElementById("barkFile");

    const previewButton =
      document.getElementById("previewButton");

    const resetSoundButton =
      document.getElementById("resetSoundButton");

    const customBarkAudio =
      document.getElementById("customBarkAudio");

    const soundName =
      document.getElementById("soundName");

    const errorBox =
      document.getElementById("errorBox");

    const calibrationNote =
      document.getElementById("calibrationNote");

    const presetButtons =
      document.querySelectorAll(".preset-button");

    function setStatus(text, mode) {
      statusText.textContent = text;

      statusIcon.classList.remove(
        "running",
        "triggered"
      );

      if (mode === "running") {
        statusIcon.classList.add("running");
      }

      if (mode === "triggered") {
        statusIcon.classList.add("triggered");
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function setThreshold(
      value,
      presetName = ""
    ) {
      const numericValue = Number(value);

      threshold = Math.max(
        minimumThreshold,
        Math.min(
          maximumThreshold,
          numericValue
        )
      );

      thresholdSlider.value =
        String(threshold);

      thresholdValue.textContent =
        String(threshold);

      /*
       * メーターは0～100の表示なので、
       * 閾値をそのままパーセント位置にします。
       */
      thresholdLine.style.left =
        threshold + "%";

      selectedPreset = presetName;

      presetButtons.forEach((button) => {
        const isSelected =
          button.dataset.name === selectedPreset;

        button.classList.toggle(
          "selected",
          isSelected
        );
      });

      try {
        localStorage.setItem(
          sensitivityStorageKey,
          String(threshold)
        );
      } catch (error) {
        /*
         * 保存できない環境でも
         * アプリの動作は継続します。
         */
      }
    }

    presetButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setThreshold(
          Number(button.dataset.value),
          button.dataset.name
        );
      });
    });

    thresholdSlider.addEventListener(
      "input",
      () => {
        setThreshold(
          thresholdSlider.value
        );
      }
    );

    minusButton.addEventListener(
      "click",
      () => {
        setThreshold(threshold - 1);
      }
    );

    plusButton.addEventListener(
      "click",
      () => {
        setThreshold(threshold + 1);
      }
    );

    barkFile.addEventListener(
      "change",
      (event) => {
        const file = event.target.files[0];

        if (!file) {
          return;
        }

        if (
          file.type &&
          !file.type.startsWith("audio/")
        ) {
          showError(
            "音声ファイルを選択してください。"
          );

          barkFile.value = "";
          return;
        }

        clearError();

        if (customSoundUrl) {
          URL.revokeObjectURL(
            customSoundUrl
          );
        }

        customSoundUrl =
          URL.createObjectURL(file);

        customBarkAudio.src =
          customSoundUrl;

        customBarkAudio.load();

        soundName.textContent =
          "選択中：" + file.name;

        resetSoundButton.disabled = false;
      }
    );

    resetSoundButton.addEventListener(
      "click",
      () => {
        stopCustomAudio();

        if (customSoundUrl) {
          URL.revokeObjectURL(
            customSoundUrl
          );
        }

        customSoundUrl = "";

        customBarkAudio.removeAttribute(
          "src"
        );

        customBarkAudio.load();

        barkFile.value = "";

        soundName.textContent =
          "内蔵音を使用中";

        resetSoundButton.disabled = true;
      }
    );

    previewButton.addEventListener(
      "click",
      async () => {
        clearError();

        try {
          await ensureAudioContext();
          await playDogBark(true);
        } catch (error) {
          showError(
            "試聴できませんでした。iPhoneの音量を確認して、もう一度お試しください。"
          );
        }
      }
    );

    monitorButton.addEventListener(
      "click",
      async () => {
        if (isMonitoring) {
          stopMonitoring();
        } else {
          await startMonitoring();
        }
      }
    );

    async function ensureAudioContext() {
      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        throw new Error(
          "このブラウザは音声機能に対応していません。"
        );
      }

      if (
        !audioContext ||
        audioContext.state === "closed"
      ) {
        audioContext =
          new AudioContextClass();
      }

      if (
        audioContext.state === "suspended"
      ) {
        await audioContext.resume();
      }
    }

    async function startMonitoring() {
      clearError();

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        showError(
          "マイクを利用できません。iPhoneのSafariからHTTPSのGitHub Pagesを開いてください。"
        );

        return;
      }

      try {
        await ensureAudioContext();

        mediaStream =
          await navigator.mediaDevices
            .getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: false
              }
            });

        analyser =
          audioContext.createAnalyser();

        analyser.fftSize = 1024;

        analyser.smoothingTimeConstant =
          0.58;

        microphone =
          audioContext
            .createMediaStreamSource(
              mediaStream
            );

        microphone.connect(analyser);

        isMonitoring = true;
        isCalibrating = true;

        noiseFloor = 0;

        lastTriggerTime = Date.now();

        monitorButton.textContent =
          "■ 監視を止める";

        monitorButton.classList.add(
          "stop"
        );

        setStatus(
          "周囲の音を確認中…",
          "running"
        );

        calibrationNote.style.display =
          "block";

        await calibrateNoise();

        if (!isMonitoring) {
          return;
        }

        isCalibrating = false;

        calibrationNote.style.display =
          "none";

        setStatus(
          "監視中",
          "running"
        );

        checkVolume();

      } catch (error) {
        stopMonitoring();

        showError(
          "マイクを開始できませんでした。Safariのマイク設定を「許可」にして、ページを再読み込みしてください。"
        );

        setStatus(
          "開始できませんでした",
          ""
        );
      }
    }

    function calibrateNoise() {
      return new Promise((resolve) => {
        const samples = [];

        const data =
          new Uint8Array(
            analyser.fftSize
          );

        const startTime =
          performance.now();

        const calibrationDuration = 1200;

        function sampleNoise() {
          if (
            !isMonitoring ||
            !analyser
          ) {
            resolve();
            return;
          }

          analyser.getByteTimeDomainData(
            data
          );

          const volume =
            calculateVolume(data);

          samples.push(volume);

          if (
            performance.now() -
            startTime <
            calibrationDuration
          ) {
            requestAnimationFrame(
              sampleNoise
            );
          } else {
            if (samples.length > 0) {
              const sorted =
                [...samples].sort(
                  (a, b) => a - b
                );

              /*
               * 周囲音の測定中に一時的な音が入っても、
               * 過大評価しにくいよう下位40％付近を使います。
               */
              const position =
                Math.floor(
                  sorted.length * 0.4
                );

              noiseFloor =
                sorted[position] || 0;
            }

            resolve();
          }
        }

        sampleNoise();
      });
    }

    function calculateVolume(data) {
      let squareTotal = 0;

      let peak = 0;

      for (
        let i = 0;
        i < data.length;
        i++
      ) {
        const normalized =
          (data[i] - 128) / 128;

        squareTotal +=
          normalized * normalized;

        const absoluteValue =
          Math.abs(normalized);

        if (absoluteValue > peak) {
          peak = absoluteValue;
        }
      }

      const rms = Math.sqrt(
        squareTotal / data.length
      );

      /*
       * RMSと瞬間的なピークを組み合わせます。
       * 手拍子や物音など短い音も拾いやすくします。
       */
      const rmsVolume = rms * 600;
      const peakVolume = peak * 220;

      const combinedVolume =
        rmsVolume * 0.72 +
        peakVolume * 0.28;

      return Math.min(
        100,
        Math.round(combinedVolume)
      );
    }

    function checkVolume() {
      if (
        !isMonitoring ||
        !analyser ||
        isCalibrating
      ) {
        return;
      }

      const data =
        new Uint8Array(
          analyser.fftSize
        );

      analyser.getByteTimeDomainData(
        data
      );

      const rawVolume =
        calculateVolume(data);

      /*
       * 周囲音の差し引きを25％に抑えます。
       * 従来より小さな音に反応しやすい設定です。
       */
      const adjustedVolume =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(
              rawVolume -
              noiseFloor * 0.25
            )
          )
        );

      updateMeter(adjustedVolume);

      const now = Date.now();

      const canTrigger =
        !isAlarmPlaying &&
        adjustedVolume >= threshold &&
        now - lastTriggerTime >=
          triggerInterval;

      if (canTrigger) {
        lastTriggerTime = now;
        triggerAlarm();
      }

      animationId =
        requestAnimationFrame(
          checkVolume
        );
    }

    function updateMeter(volume) {
      currentVolume.textContent =
        String(volume);

      meterBar.style.width =
        volume + "%";

      if (volume >= threshold) {
        meterBar.style.backgroundColor =
          "#f97316";
      } else {
        meterBar.style.backgroundColor =
          "#22c55e";
      }
    }

    async function triggerAlarm() {
      if (
        !isMonitoring ||
        isAlarmPlaying
      ) {
        return;
      }

      isAlarmPlaying = true;

      setStatus(
        "音を検知しました",
        "triggered"
      );

      try {
        await playDogBark(false);
      } catch (error) {
        showError(
          "犬の声を再生できませんでした。iPhoneの音量と消音設定を確認してください。"
        );
      }

      window.setTimeout(() => {
        isAlarmPlaying = false;

        if (isMonitoring) {
          setStatus(
            "監視中",
            "running"
          );
        }
      }, 2700);
    }

    async function playDogBark(
      isPreview
    ) {
      await ensureAudioContext();

      if (customSoundUrl) {
        stopCustomAudio();

        customBarkAudio.currentTime = 0;

        try {
          await customBarkAudio.play();
        } catch (error) {
          throw error;
        }

        return;
      }

      playBuiltInBark();
    }

    function stopCustomAudio() {
      customBarkAudio.pause();

      try {
        customBarkAudio.currentTime = 0;
      } catch (error) {
        /*
         * 音声未読込時のエラーは無視します。
         */
      }
    }

    function playBuiltInBark() {
      if (!audioContext) {
        return;
      }

      const start =
        audioContext.currentTime + 0.02;

      createBarkSound(
        start,
        0.93,
        0.92
      );

      createBarkSound(
        start + 0.31,
        1.04,
        0.76
      );
    }

    function createBarkSound(
      startTime,
      pitch,
      volume
    ) {
      const sampleRate =
        audioContext.sampleRate;

      const duration = 0.27;

      const buffer =
        audioContext.createBuffer(
          1,
          Math.floor(
            sampleRate * duration
          ),
          sampleRate
        );

      const channel =
        buffer.getChannelData(0);

      let previousNoise = 0;

      for (
        let i = 0;
        i < channel.length;
        i++
      ) {
        const time =
          i / sampleRate;

        const attack =
          Math.min(
            1,
            time / 0.009
          );

        const decay =
          Math.exp(
            -12.5 * time
          );

        const envelope =
          attack * decay;

        const frequency =
          (175 * pitch) -
          (95 * time);

        const throat1 =
          Math.sin(
            2 *
            Math.PI *
            frequency *
            time
          );

        const throat2 =
          Math.sin(
            2 *
            Math.PI *
            frequency *
            1.83 *
            time
          );

        const randomNoise =
          Math.random() * 2 - 1;

        const roughNoise =
          randomNoise * 0.72 +
          previousNoise * 0.28;

        previousNoise = roughNoise;

        channel[i] =
          (
            throat1 * 0.27 +
            throat2 * 0.13 +
            roughNoise * 0.72
          ) *
          envelope *
          volume;
      }

      const source =
        audioContext
          .createBufferSource();

      const bandPass =
        audioContext
          .createBiquadFilter();

      const lowPass =
        audioContext
          .createBiquadFilter();

      const gain =
        audioContext.createGain();

      source.buffer = buffer;

      bandPass.type = "bandpass";

      bandPass.frequency
        .setValueAtTime(
          720 * pitch,
          startTime
        );

      bandPass.frequency
        .exponentialRampToValueAtTime(
          430 * pitch,
          startTime + duration
        );

      bandPass.Q.value = 0.7;

      lowPass.type = "lowpass";

      lowPass.frequency.value =
        2100;

      gain.gain.setValueAtTime(
        0.7,
        startTime
      );

      gain.gain
        .exponentialRampToValueAtTime(
          0.01,
          startTime + duration
        );

      source
        .connect(bandPass)
        .connect(lowPass)
        .connect(gain)
        .connect(
          audioContext.destination
        );

      source.start(startTime);

      source.stop(
        startTime + duration
      );
    }

    function stopMonitoring() {
      isMonitoring = false;
      isCalibrating = false;
      isAlarmPlaying = false;

      if (animationId) {
        cancelAnimationFrame(
          animationId
        );

        animationId = null;
      }

      stopCustomAudio();

      if (mediaStream) {
        mediaStream
          .getTracks()
          .forEach(
            (track) => track.stop()
          );

        mediaStream = null;
      }

      microphone = null;
      analyser = null;

      if (
        audioContext &&
        audioContext.state !== "closed"
      ) {
        audioContext
          .close()
          .catch(() => {});
      }

      audioContext = null;

      updateMeter(0);

      calibrationNote.style.display =
        "none";

      monitorButton.textContent =
        "🎤 監視スタート";

      monitorButton.classList.remove(
        "stop"
      );

      setStatus(
        "待機中",
        ""
      );
    }

    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.hidden &&
          isMonitoring
        ) {
          stopMonitoring();

          showError(
            "画面が閉じられたため、監視を停止しました。再開する場合は「監視スタート」を押してください。"
          );
        }
      }
    );

    window.addEventListener(
      "beforeunload",
      () => {
        if (customSoundUrl) {
          URL.revokeObjectURL(
            customSoundUrl
          );
        }

        if (mediaStream) {
          mediaStream
            .getTracks()
            .forEach(
              (track) => track.stop()
            );
        }
      }
    );

    function loadSavedThreshold() {
      try {
        const savedThreshold =
          localStorage.getItem(
            sensitivityStorageKey
          );

        if (savedThreshold === null) {
          setThreshold(
            16,
            "標準"
          );

          return;
        }

        const savedValue =
          Number(savedThreshold);

        if (
          !Number.isFinite(
            savedValue
          ) ||
          savedValue <
            minimumThreshold ||
          savedValue >
            maximumThreshold
        ) {
          setThreshold(
            16,
            "標準"
          );

          return;
        }

        if (savedValue === 8) {
          setThreshold(
            8,
            "高感度"
          );
        } else if (
          savedValue === 16
        ) {
          setThreshold(
            16,
            "標準"
          );
        } else if (
          savedValue === 28
        ) {
          setThreshold(
            28,
            "低感度"
          );
        } else {
          setThreshold(
            savedValue
          );
        }

      } catch (error) {
        setThreshold(
          16,
          "標準"
        );
      }
    }

    loadSavedThreshold();
  </script>
</body>
