<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音検知アラーム</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
  .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  button { font-size: 16px; padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
  #startBtn { background-color: #007aff; color: white; }
  #stopBtn { background-color: #8e8e93; color: white; }
  .slider-container { margin: 20px 0; }
  input[type=range] { width: 80%; }
  .meter { height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin: 15px 0; }
  #meterBar { height: 100%; width: 0%; background: #34c759; transition: width 0.1s; }
  #status { font-size: 12px; color: #d9534f; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h2>音検知アラーム</h2>
  <button id="startBtn" onclick="startMonitoring()">監視スタート</button>
  <button id="stopBtn" onclick="stopMonitoring()" disabled>ストップ</button>

  <div class="meter"><div id="meterBar"></div></div>
  <p>現在の音量: <span id="currentVolume">0</span></p>

  <div class="slider-container">
    <label for="sensitivity">反応する感度（閾値）: <b id="thresholdVal">30</b></label><br>
    <input type="range" id="sensitivity" min="5" max="100" value="30" oninput="updateThreshold(this.value)">
    <p style="font-size: 12px; color: #666;">（数字を小さくすると小さな音でも反応します）</p>
  </div>
  <div id="status"></div>
</div>

<script>
let audioContext, analyser, microphone, stream;
let isMonitoring = false;
let threshold = 30;
let lastTriggerTime = 0;

// Web Audio APIによるリアルな犬の鳴き声（ワンワン！）完全内蔵プログラム
function playDogBark() {
  if (!audioContext) return;
  
  const now = audioContext.currentTime;
  
  function singleBark(startTime) {
    // オシレーター（声帯）
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();

    // 鳴き声の波形とピッチ（小型〜中型犬のワン！）
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(650, startTime);
    osc.frequency.exponentialRampToValueAtTime(200, startTime + 0.12);

    // フィルターで音角を丸めて肉声感を出す
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1500, startTime);

    // 音量エンベロープ（勢いよくアタックして消える）
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.8, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.12);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(startTime);
    osc.stop(startTime + 0.12);
  }

  // 2回鳴らす（ワン！ワン！）
  singleBark(now);
  singleBark(now + 0.18);
}

function updateThreshold(val) {
  threshold = parseInt(val);
  document.getElementById('thresholdVal').innerText = val;
}

async function startMonitoring() {
  try {
    // AudioContextの生成とユーザー操作（タップ）による再生ロック解除
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioCtx();
    
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    // マイクの取得
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    analyser = audioContext.createAnalyser();
    microphone = audioContext.createMediaStreamSource(stream);
    
    analyser.fftSize = 256;
    microphone.connect(analyser);
    
    isMonitoring = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('status').innerText = "";
    
    // 起動確認のために最初に小さく「テスト音」を鳴らす
    playDogBark();
    
    checkVolume();
  } catch (err) {
    alert('マイクのアクセス許可が必要です: ' + err.message);
  }
}

function checkVolume() {
  if (!isMonitoring) return;
  
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    sum += dataArray[i];
  }
  const average = Math.round(sum / dataArray.length);
  
  document.getElementById('meterBar').style.width = Math.min(100, average * 2) + '%';
  document.getElementById('currentVolume').innerText = average;
  
  // 閾値を超えた場合に鳴らす（連続防止のため1.5秒間隔）
  const now = Date.now();
  if (average >= threshold && (now - lastTriggerTime > 1500)) {
    lastTriggerTime = now;
    playDogBark();
  }
  
  requestAnimationFrame(checkVolume);
}

function stopMonitoring() {
  isMonitoring = false;
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (audioContext) audioContext.close();
  
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  document.getElementById('meterBar').style.width = '0%';
  document.getElementById('currentVolume').innerText = '0';
}
</script>
</body>
</html>
