<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音検知アラーム</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f9;
    }
    button {
      font-size: 1.2rem;
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
    }
    .status {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .meter {
      font-size: 2rem;
      color: #333;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <h1>音検知アラーム</h1>
  <p>周囲の音が一定レベルを超えると音が鳴ります。</p>

  <button id="startBtn">監視スタート</button>
  <button id="stopBtn" disabled>ストップ</button>

  <div class="meter">現在の音量: <span id="volumeVal">0</span></div>
  <div class="status" id="statusText">停止中</div>

  <script>
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let intervalId = null;
    let isCooldown = false;

    const THRESHOLD = 30;       // 音量しきい値 (0〜255)
    const CHECK_INTERVAL = 100; // 監視間隔 (ミリ秒)

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const volumeVal = document.getElementById('volumeVal');
    const statusText = document.getElementById('statusText');

    // 効果音（ビープ音）を発生させる関数
    function playBeep() {
      if (!audioContext) return;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioContext.currentTime); // 880Hz

      gain.gain.setValueAtTime(0.5, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3); // 0.3秒で減衰

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + 0.3);
    }

    // 監視開始
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusText.innerText = "監視中...";
        statusText.style.color = "green";

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        intervalId = setInterval(() => {
          analyser.getByteFrequencyData(dataArray);
          
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const average = Math.round(sum / dataArray.length);
          volumeVal.innerText = average;

          // しきい値を超えた場合
          if (average > THRESHOLD && !isCooldown) {
            playBeep();
            statusText.innerText = "音を感知しました！";
            statusText.style.color = "red";
            
            isCooldown = true;
            setTimeout(() => {
              isCooldown = false;
              statusText.innerText = "監視中...";
              statusText.style.color = "green";
            }, 1000); // 1秒間クールダウン
          }
        }, CHECK_INTERVAL);

      } catch (err) {
        alert("マイクのアクセス許可が必要です: " + err.message);
      }
    });

    // 監視停止
    stopBtn.addEventListener('click', () => {
      if (intervalId) clearInterval(intervalId);
      if (audioContext) audioContext.close();
      
      startBtn.disabled = false;
      stopBtn.disabled = true;
      volumeVal.innerText = "0";
      statusText.innerText = "停止中";
      statusText.style.color = "black";
    });
  </script>
</body>
</html>
